services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis_data:/data]
  api:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS}
      PROJECT_ROOT: /data/projects
      UPLOAD_ROOT: /data/uploads
    ports: ["5000:5000"]
    volumes: [projects:/data/projects, uploads:/data/uploads]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
  collaboration:
    build: ./collaboration
    environment:
      PORT: ${COLLAB_PORT}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
    ports: ["3001:3001"]
    depends_on: [redis]
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_COLLAB_URL: ${VITE_COLLAB_URL}
    ports: ["5173:80"]
    depends_on: [api, collaboration]
volumes:
  postgres_data:
  redis_data:
  projects:
  uploads:
